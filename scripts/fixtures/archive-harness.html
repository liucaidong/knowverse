<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>KNOWVERSE Phase D archive E2E harness</title></head>
<body>
<script type="module">
import { createLearningProgressStore } from "/assets/js/learning-progress.mjs";
import { getLearningRepository } from "/assets/js/backend/learning-repository.mjs";
import { createLearningSyncService } from "/assets/js/backend/sync-engine.mjs";

const repository = await getLearningRepository();
const store = createLearningProgressStore({ repository });
const auth = {
  getSession: async () => ({ user: { id: "archive-test-user", email: "archive@example.test" } }),
  request: async (path, options = {}) => {
    const response = await fetch("/mock" + path, {
      method: options.method || "GET",
      headers: { "content-type": "application/json" },
      body: options.body === undefined ? undefined : JSON.stringify(options.body)
    });
    const result = await response.json();
    if (!response.ok) throw new Error(result.message || "Mock RPC failed");
    return result;
  }
};
const service = createLearningSyncService(auth, store, { enabled: true });
const syncStatuses = [];
window.addEventListener("knowverse:sync-state", event => syncStatuses.push(event.detail?.status));
const autoStart = new URLSearchParams(location.search).get("manualRestore") !== "1";
const stop = autoStart ? service.start() : () => {};
window.archiveHarness = {
  store,
  repository,
  auth,
  service,
  syncStatuses,
  sync: () => service.sync(),
  restoreFromCloud: () => service.restoreFromCloud(),
  capture: () => repository.sync.status(),
  addEvent: event => store.appendMany([event]),
  putDocument: document => repository.documents.put(document),
  getDocument: (type, key) => repository.documents.get(type, key),
  listEvents: () => repository.events.list(),
  status: () => repository.sync.status(),
  conflicts: () => repository.documents.conflicts(),
  resolve: (id, choice) => repository.documents.resolveConflict(id, choice),
  stop,
};
window.archiveReady = true;
</script>
</body>
</html>
