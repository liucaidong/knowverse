<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>第一领域 · 3D 机制世界 | KNOWVERSE</title><style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#050714;color:#e8f0ff;font:15px system-ui,sans-serif}#scene{position:fixed;inset:0;overflow:hidden;background:radial-gradient(ellipse at 50% 35%,#192443,#070b19 75%)}#world{position:absolute;left:50%;top:53%;width:0;height:0;perspective:700px;transform-style:preserve-3d}#camera{position:absolute;transform-style:preserve-3d} .plane{position:absolute;transform-style:preserve-3d;backface-visibility:visible}.floor{width:1400px;height:1400px;left:-700px;top:-700px;transform:rotateX(90deg) translateZ(-60px);background:repeating-linear-gradient(0deg,transparent 0 93px,#2b436057 94px 95px),repeating-linear-gradient(90deg,#101c2c 0 93px,#30445c6e 94px 95px)}.wall{width:1300px;height:320px;left:-650px;top:-230px;background:linear-gradient(0deg,#15283e,#233652 70%,#0a1225);border:2px solid #5e7690}.north{transform:translateZ(-600px)}.south{transform:rotateY(180deg) translateZ(-600px)}.east{transform:rotateY(-90deg) translateZ(-600px)}.west{transform:rotateY(90deg) translateZ(-600px)}.cube{position:absolute;transform-style:preserve-3d;width:100px;height:100px;margin-left:-50px;margin-top:-50px}.face{position:absolute;inset:0;border:1px solid #7d99b5;background:linear-gradient(145deg,#1c3858,#091529);box-shadow:inset 0 0 35px #4dc9f61a}.cube .f{transform:translateZ(50px)}.cube .b{transform:rotateY(180deg) translateZ(50px)}.cube .r{transform:rotateY(90deg) translateZ(50px)}.cube .l{transform:rotateY(-90deg) translateZ(50px)}.cube .u{transform:rotateX(90deg) translateZ(50px)}.cube .d{transform:rotateX(-90deg) translateZ(50px)}.cube .f{display:grid;place-items:center;text-align:center;color:#a7f8e7;font-size:13px;letter-spacing:.06em}.cube.active .face{background:linear-gradient(145deg,#134944,#0a2728);border-color:#6eefd6;box-shadow:0 0 38px #63ebbe55}.hud{position:fixed;top:18px;left:20px;right:20px;display:flex;gap:12px;justify-content:space-between;align-items:start;pointer-events:none}.hud>*{pointer-events:auto}.brand{font-weight:800;letter-spacing:.12em}.brand small{display:block;font-weight:400;letter-spacing:normal;color:#9eaeca;margin-top:6px}.hud a{color:#c3d6f4;text-decoration:none;border:1px solid #47607d;border-radius:10px;background:#0b1326bf;padding:11px}.panel{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);width:min(650px,calc(100% - 30px));text-align:center;background:#071023df;border:1px solid #34546b;border-radius:16px;padding:16px 22px;backdrop-filter:blur(12px)}.panel p{margin:8px 0;color:#b8c6dc;line-height:1.5}.status{font-size:13px;color:#8ae4cd}.tip{position:fixed;top:100px;left:22px;font-size:13px;color:#afbdd7;background:#071020b0;border-radius:10px;padding:10px;line-height:1.7}#cross{position:absolute;left:50%;top:50%;width:12px;height:12px;border:1px solid #b9d8ec;border-radius:100%;transform:translate(-50%,-50%);opacity:.65}.touch{position:fixed;bottom:170px;right:18px;display:flex;gap:6px}.touch button{background:#1b3449bb;border:1px solid #7296b2;color:white;border-radius:13px;padding:15px;font-size:17px}#action{background:#81ead1;color:#092023;font-weight:bold}.error{color:#ffb5a0}@media(min-width:900px){.touch{opacity:.7}}@media(max-width:600px){.tip{top:85px;font-size:11px}.touch{bottom:165px}.touch button{padding:11px}.panel{font-size:13px}}</style></head><body><div id="scene"><div id="world"><div id="camera"><div class="plane floor"></div><div class="plane wall north"></div><div class="plane wall south"></div><div class="plane wall east"></div><div class="plane wall west"></div></div></div><div id="cross"></div></div><div class="hud"><div class="brand">KNOWVERSE / FIRST REALM<small>世界 01 · Promise 的门</small></div><a href="../../../">← 返回解谜世界</a></div><div class="tip">WASD / 方向键：移动与转向<br> E / 空格：交互<br> 手机：下方触控按钮</div><div class="panel"><div id="state" class="status">PENDING · 仍在等待</div><p id="message">激活「Resolve」装置，再到「Reaction」装置领取通行密钥，最后开启门。</p></div><div class="touch"><button data-k="ArrowLeft" aria-label="左转">↶</button><button data-k="KeyW" aria-label="前进">↑</button><button data-k="ArrowRight" aria-label="右转">↷</button><button id="action">交互 E</button></div><script>
(()=>{const camera=document.getElementById('camera'),message=document.getElementById('message'),state=document.getElementById('state');let x=0,z=280,angle=0,phase=0,won=false;const boxes=[{id:'resolve',x:-260,z:-120,label:'RESOLVE\n装置'},{id:'reaction',x:210,z:-130,label:'REACTION\n装置'},{id:'exit',x:0,z:-495,label:'EXIT\n出口'}];const keys=new Set();for(const b of boxes){const cube=document.createElement('div');cube.className='cube';cube.id=b.id;cube.style.transform='translate3d('+b.x+'px,-110px,'+b.z+'px)';cube.innerHTML=['f','b','r','l','u','d'].map(v=>'<div class="face '+v+'">'+(v==='f'?b.label.replace('\n','<br>'):'')+'</div>').join('');camera.append(cube)}function render(){camera.style.transform='translate3d('+(-x)+'px,40px,'+(-z)+'px) rotateY('+(-angle)+'rad)';const d=boxes.map(b=>({b,dist:Math.hypot(b.x-x,b.z-z)})).sort((a,b)=>a.dist-b.dist)[0];document.getElementById('action').textContent=d.dist<155?'交互 · '+d.b.id.toUpperCase():'交互 E'}function notice(s,err=false){message.textContent=s;message.className=err?'error':''}function action(){if(won)return;const near=boxes.filter(b=>Math.hypot(b.x-x,b.z-z)<155).sort((a,b)=>Math.hypot(a.x-x,a.z-z)-Math.hypot(b.x-x,b.z-z))[0];if(!near){notice('距离装置太远。靠近发光的装置再进行交互。',true);return}if(near.id==='resolve'){phase=Math.max(phase,1);document.getElementById('resolve').classList.add('active');state.textContent='FULFILLED · 已兑现';notice('Promise 已兑现，但 reaction 还需要在微任务检查点执行。前往 REACTION 装置。')}else if(near.id==='reaction'){if(phase<1){notice('Reaction 尚不能执行：Promise 仍在 pending 状态。先激活 RESOLVE。',true);return}phase=2;document.getElementById('reaction').classList.add('active');notice('微任务执行，反应完成！你获得出口密钥。前往 EXIT。')}else if(phase<2){notice('出口拒绝开启：虽然兑现可能已经发生，但反应链尚未完成。',true)}else{won=true;document.getElementById('exit').classList.add('active');state.textContent='WORLD CLEAR · 第一领域解锁';notice('解谜成功！你区分了 Promise 状态落定与 reaction 执行的不同阶段。可以继续自由探索。')}}let prev=0;function frame(now){const dt=Math.min(.04,(now-prev)/1000||.016);prev=now;let move=0,turn=0;if(keys.has('KeyW')||keys.has('ArrowUp'))move=1;if(keys.has('KeyS')||keys.has('ArrowDown'))move=-1;if(keys.has('KeyA')||keys.has('ArrowLeft'))turn=-1;if(keys.has('KeyD')||keys.has('ArrowRight'))turn=1;angle+=turn*dt*1.65;x+=Math.sin(angle)*move*dt*260;z-=Math.cos(angle)*move*dt*260;x=Math.max(-480,Math.min(480,x));z=Math.max(-470,Math.min(490,z));render();requestAnimationFrame(frame)}addEventListener('keydown',e=>{if(['Space','KeyE'].includes(e.code)){if(!e.repeat)action();e.preventDefault()}else if(['KeyW','KeyS','KeyA','KeyD','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code)){keys.add(e.code);e.preventDefault()}});addEventListener('keyup',e=>keys.delete(e.code));addEventListener('blur',()=>keys.clear());document.querySelectorAll('[data-k]').forEach(b=>{b.addEventListener('pointerdown',e=>{e.preventDefault();keys.add(b.dataset.k);b.setPointerCapture(e.pointerId)});for(const t of ['pointerup','pointercancel','lostpointercapture'])b.addEventListener(t,()=>keys.delete(b.dataset.k))});document.getElementById('action').onclick=action;requestAnimationFrame(frame)})();
</script></body></html>
