<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="760" viewBox="0 0 1600 760" role="img" aria-labelledby="title desc">
<title id="title">React Native New Architecture: Build, Startup, Runtime</title>
<desc id="desc">Three-stage architecture map showing parallel Hermes and Codegen build artifact paths, startup Runtime and JSI, TurboModules and Fabric, then rendering and host view mounting.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f8fbfc"/><stop offset="1" stop-color="#eaf2f7"/></linearGradient>
 <linearGradient id="build" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#d8eaf4"/><stop offset="1" stop-color="#eef5fa"/></linearGradient>
 <linearGradient id="startup" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e3def8"/><stop offset="1" stop-color="#f5f2fc"/></linearGradient>
 <linearGradient id="runtime" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#d9eee8"/><stop offset="1" stop-color="#f0f8f5"/></linearGradient>
 <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#26455b" flood-opacity=".12"/></filter>
 <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#54758a" stroke-width="1.4"/></marker>
 <style>
  .stage{font:700 24px system-ui,sans-serif;fill:#284c63}.subtitle{font:12px system-ui,sans-serif;fill:#617d8e}
  .node{fill:#fff;stroke:#a9c2d0;stroke-width:1.5;filter:url(#shadow)}.node2{fill:#fff;stroke:#b9b0dc;stroke-width:1.5;filter:url(#shadow)}.node3{fill:#fff;stroke:#9ac9b9;stroke-width:1.5;filter:url(#shadow)}
  .label{font:700 16px system-ui,sans-serif;fill:#24465d}.small{font:12px system-ui,sans-serif;fill:#607b8d}
  .flow{fill:none;stroke:#54758a;stroke-width:2.2;marker-end:url(#arrow)}.dashed{stroke-dasharray:5 5}
 </style>
</defs>
<rect width="1600" height="760" rx="30" fill="url(#bg)"/>
<text x="60" y="55" class="stage" font-size="27">REACT NATIVE NEW ARCHITECTURE</text>
<text x="60" y="82" class="subtitle">Build artifacts → Startup runtime → Runtime interactions / RN 0.88 baseline · 2026-11-01</text>
<rect x="42" y="118" width="465" height="585" rx="24" fill="url(#build)" stroke="#b8d4e4"/>
<rect x="567" y="118" width="435" height="585" rx="24" fill="url(#startup)" stroke="#c8bee5"/>
<rect x="1062" y="118" width="496" height="585" rx="24" fill="url(#runtime)" stroke="#b4d8cc"/>
<text x="70" y="160" class="stage">01 · Build Time</text><text x="70" y="183" class="subtitle">Two independent artifact paths</text>
<rect x="72" y="215" width="170" height="62" rx="12" class="node"/><text x="157" y="241" text-anchor="middle" class="label">JS / TS source</text><text x="157" y="260" text-anchor="middle" class="small">application code</text>
<rect x="306" y="215" width="158" height="62" rx="12" class="node"/><text x="385" y="241" text-anchor="middle" class="label">Metro bundle</text><text x="385" y="260" text-anchor="middle" class="small">bundle output</text>
<path d="M242 246 H301" class="flow"/>
<rect x="306" y="319" width="158" height="66" rx="12" class="node"/><text x="385" y="345" text-anchor="middle" class="label">Hermes compiler</text><text x="385" y="365" text-anchor="middle" class="small">.hbc bytecode</text><path d="M385 278 V314" class="flow"/>
<rect x="72" y="438" width="170" height="62" rx="12" class="node"/><text x="157" y="464" text-anchor="middle" class="label">Typed spec</text><text x="157" y="484" text-anchor="middle" class="small">TypeScript / Flow</text>
<rect x="306" y="438" width="158" height="62" rx="12" class="node"/><text x="385" y="464" text-anchor="middle" class="label">Codegen</text><text x="385" y="484" text-anchor="middle" class="small">C++ / platform glue</text><path d="M242 469 H301" class="flow"/>
<rect x="178" y="565" width="200" height="66" rx="12" class="node"/><text x="278" y="591" text-anchor="middle" class="label">Native app build</text><text x="278" y="611" text-anchor="middle" class="small">Android / iOS</text>
<path d="M385 385 V535 H278 V560" class="flow"/><path d="M385 500 V535 H278" class="flow"/>
<text x="590" y="160" class="stage">02 · App Startup</text><text x="590" y="183" class="subtitle">Initialize runtime and native capabilities</text>
<rect x="630" y="225" width="305" height="70" rx="14" class="node2"/><text x="782" y="253" text-anchor="middle" class="label">Create JS Runtime</text><text x="782" y="275" text-anchor="middle" class="small">load bundle / bytecode</text>
<rect x="630" y="343" width="138" height="74" rx="14" class="node2"/><text x="699" y="372" text-anchor="middle" class="label">JSI bindings</text><text x="699" y="394" text-anchor="middle" class="small">C++ ↔ JS</text>
<rect x="798" y="343" width="138" height="74" rx="14" class="node2"/><text x="867" y="372" text-anchor="middle" class="label">TurboModules</text><text x="867" y="394" text-anchor="middle" class="small">registry / lazy lookup</text>
<rect x="715" y="478" width="220" height="72" rx="14" class="node2"/><text x="825" y="506" text-anchor="middle" class="label">Fabric renderer</text><text x="825" y="528" text-anchor="middle" class="small">renderer initialized</text>
<path d="M782 295 V337 H699" class="flow"/><path d="M782 295 V337 H867" class="flow"/><path d="M699 417 V450 H825 V472" class="flow"/><path d="M867 417 V450 H825" class="flow"/>
<path d="M378 598 H535 V260 H624" class="flow dashed"/>
<text x="1088" y="160" class="stage">03 · Runtime</text><text x="1088" y="183" class="subtitle">Calls, rendering and event scheduling</text>
<rect x="1100" y="218" width="190" height="62" rx="12" class="node3"/><text x="1195" y="244" text-anchor="middle" class="label">JSI / Native calls</text><text x="1195" y="264" text-anchor="middle" class="small">HostFunction / APIs</text>
<rect x="1320" y="218" width="190" height="62" rx="12" class="node3"/><text x="1415" y="244" text-anchor="middle" class="label">Native events</text><text x="1415" y="264" text-anchor="middle" class="small">priority / dispatch</text>
<rect x="1090" y="344" width="205" height="62" rx="12" class="node3"/><text x="1192" y="370" text-anchor="middle" class="label">Render</text><text x="1192" y="390" text-anchor="middle" class="small">Element + Shadow Tree</text>
<rect x="1320" y="344" width="205" height="62" rx="12" class="node3"/><text x="1422" y="370" text-anchor="middle" class="label">Commit</text><text x="1422" y="390" text-anchor="middle" class="small">Yoga layout / tree promotion</text>
<rect x="1204" y="474" width="230" height="62" rx="12" class="node3"/><text x="1319" y="500" text-anchor="middle" class="label">Mount</text><text x="1319" y="520" text-anchor="middle" class="small">diff / UI Thread host views</text>
<rect x="1204" y="593" width="230" height="62" rx="12" class="node3"/><text x="1319" y="619" text-anchor="middle" class="label">Pixels on screen</text><text x="1319" y="639" text-anchor="middle" class="small">platform view tree</text>
<path d="M1195 280 V338" class="flow"/><path d="M1295 375 H1314" class="flow"/><path d="M1422 406 V468 H1319" class="flow"/><path d="M1319 536 V587" class="flow"/><path d="M1415 280 V315 H1192 V338" class="flow dashed"/>
<path d="M935 513 H1032 V249 H1094" class="flow dashed"/><path d="M935 513 H1044 V374 H1084" class="flow dashed"/>
<text x="62" y="680" class="subtitle">Conceptual responsibility map, not a literal thread trace or device memory diagram.</text>
</svg>