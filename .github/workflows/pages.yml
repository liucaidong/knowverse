name: Deploy KNOWVERSE to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build deterministic full-text search index from source pages
        run: python3 scripts/build-search-index.py
      - name: Verify generated search index is reproducible
        run: python3 scripts/build-search-index.py --check
      - name: Build manifest-derived Monorepo workspace graph
        run: python3 scripts/build-monorepo-graph.py
      - name: Verify Monorepo graph is reproducible from package manifests
        run: python3 scripts/build-monorepo-graph.py --check
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
