name: Deploy KNOWVERSE to GitHub Pages
on:
  push:
    branches: [develop]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build public concept pages and registry-backed catalogues
        run: node scripts/build-public-content.mjs
      - name: Build static knowledge context into topic and article pages
        run: python3 scripts/build-knowledge-context.py
      - name: Build static site shell, nested navigation and single account control
        run: node scripts/build-site-shell.mjs
      - name: Validate generated knowledge context and content relationships
        run: python3 scripts/validate-content.py
      - name: Validate canonical routes and site architecture before deployment
        run: node scripts/validate-site-architecture.mjs
      - name: Build deterministic full-text search index from final public pages and Concept registry
        run: python3 scripts/build-search-index.py
      - name: Verify generated search index is reproducible
        run: python3 scripts/build-search-index.py --check
      - name: Build manifest-derived Monorepo workspace graph
        run: python3 scripts/build-monorepo-graph.py
      - name: Verify Monorepo graph is reproducible from package manifests
        run: python3 scripts/build-monorepo-graph.py --check
      - name: Assemble public Pages site from an explicit allowlist
        run: |
          mkdir -p _site
          rsync -a --delete \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='supabase/' \
            --exclude='scripts/' \
            --exclude='node_modules/' \
            --exclude='_site/' \
            --exclude='.env*' \
            --exclude='docs/backend/' \
            ./ _site/
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
