name: iOS Simulator Native Compile · KNOWVERSE
on:
  push:
    branches: [main]
    paths:
      - 'knowledge/monorepo/fullstack/project/**'
      - '.github/workflows/monorepo-ios.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: knowverse-ios-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ios-simulator:
    runs-on: macos-26
    timeout-minutes: 65
    defaults:
      run:
        working-directory: knowledge/monorepo/fullstack/project
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
      COCOAPODS_DISABLE_STATS: 'true'
      MAESTRO_VERSION: '2.11.0'
    steps:
      - uses: actions/checkout@v4
      - name: Select Expo SDK 58-compatible Xcode
        run: |
          sudo xcode-select --switch /Applications/Xcode_26.4.1.app/Contents/Developer
          xcodebuild -version
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: pnpm/action-setup@v4
        with:
          version: '12.16.1'
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
          cache: pnpm
          cache-dependency-path: knowledge/monorepo/fullstack/project/pnpm-lock.yaml
      - name: Install pinned Maestro CLI
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.maestro/bin:$PATH"
          maestro_version="$(maestro --version)"
          printf 'Expected Maestro %s; installed: %s\n' "$MAESTRO_VERSION" "$maestro_version"
          [[ "$maestro_version" == *"$MAESTRO_VERSION"* ]]
      - name: Frozen dependency install
        run: pnpm install --frozen-lockfile
      - name: Build shared packages and check RN types
        run: |
          pnpm build:shared
          pnpm --filter @kv/mobile typecheck
      - name: Compile NestJS API for real device HTTP smoke test
        run: pnpm --filter @kv/api build
      - name: Generate iOS native project
        run: pnpm --filter @kv/mobile exec expo prebuild --platform ios --no-install
      - name: CocoaPods install
        run: |
          cd apps/mobile/ios
          pod install
      - name: Compile unsigned simulator app with Xcode
        run: |
          cd apps/mobile/ios
          workspace=$(find . -maxdepth 1 -name '*.xcworkspace' -print -quit)
          test -n "$workspace"
          scheme=$(find . -maxdepth 1 -name '*.xcodeproj' -print -quit | sed 's#./##;s#.xcodeproj##')
          test -n "$scheme"
          xcodebuild -workspace "$workspace" -scheme "$scheme" -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$PWD/build/DerivedData" CODE_SIGNING_ALLOWED=NO \
            -parallelizeTargets build
      - name: Package simulator app as artifact
        if: success()
        run: |
          cd apps/mobile/ios
          app=$(find build/DerivedData/Build/Products/Debug-iphonesimulator -maxdepth 1 -name '*.app' -print -quit)
          test -n "$app"
          ditto -c -k --sequesterRsrc --keepParent "$app" "${RUNNER_TEMP}/knowverse-ios-simulator.zip"
      - name: Upload unsigned iOS simulator app
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: knowverse-ios-simulator-${{ github.run_number }}
          path: ${{ runner.temp }}/knowverse-ios-simulator.zip
          if-no-files-found: error
          retention-days: 7
      - name: Boot iPhone Simulator and verify app launch + NestJS API
        run: bash tools/device-smoke/ios.sh
      - name: Archive iOS simulator evidence (screenshot and logs)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: knowverse-ios-device-evidence-${{ github.run_number }}
          path: ${{ runner.temp }}/knowverse-device-smoke/
          if-no-files-found: warn
          retention-days: 7
