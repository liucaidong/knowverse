name: Android Native Compile · KNOWVERSE
on:
  push:
    branches: [main]
    paths:
      - 'knowledge/monorepo/fullstack/project/**'
      - '.github/workflows/monorepo-android.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: knowverse-android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android-debug:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    defaults:
      run:
        working-directory: knowledge/monorepo/fullstack/project
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: '12.16.1'
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
          cache: pnpm
          cache-dependency-path: knowledge/monorepo/fullstack/project/pnpm-lock.yaml
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - name: Install exact Android 37.0 platform and build tools
        run: |
          sdkmanager --channel=3 'platforms;android-37.0' 'build-tools;37.0.0'
          test -f "${ANDROID_HOME}/platforms/android-37.0/android.jar"
      - uses: gradle/actions/setup-gradle@v4
      - name: Frozen dependency install
        run: pnpm install --frozen-lockfile
      - name: Verify the shared packages and RN types
        run: |
          pnpm build:shared
          pnpm --filter @kv/mobile typecheck
      - name: Compile NestJS API for real device HTTP smoke test
        run: pnpm --filter @kv/api build
      - name: Generate reproducible Android native project
        run: pnpm --filter @kv/mobile exec expo prebuild --platform android --no-install
      - name: Compile Android debug APK (debug key only)
        run: |
          chmod +x apps/mobile/android/gradlew
          (cd apps/mobile/android && ./gradlew :app:assembleDebug --no-daemon --stacktrace)
      - name: Upload debug APK for emulator/device verification
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: knowverse-android-debug-${{ github.run_number }}
          path: knowledge/monorepo/fullstack/project/apps/mobile/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
      - name: Enable hardware virtualization for Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Launch Android emulator and assert actual RN screen + NestJS API
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          working-directory: knowledge/monorepo/fullstack/project
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: bash tools/device-smoke/android.sh
      - name: Archive Android simulator evidence (screenshots, UI tree, logcat)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: knowverse-android-device-evidence-${{ github.run_number }}
          path: ${{ runner.temp }}/knowverse-device-smoke/
          if-no-files-found: warn
          retention-days: 7
