name: Validate KNOWVERSE Content
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build deterministic full-text search index from source pages
        run: python3 scripts/build-search-index.py
      - name: Verify generated search index is reproducible
        run: python3 scripts/build-search-index.py --check
      - name: Build manifest-derived Monorepo workspace graph
        run: python3 scripts/build-monorepo-graph.py
      - name: Verify Monorepo graph is reproducible from package manifests
        run: python3 scripts/build-monorepo-graph.py --check
      - name: Validate V1 content registry and routes
        run: python3 scripts/validate-content.py
      - name: Validate V2 knowledge pages and Mermaid panoramas
        run: python3 scripts/validate-v2.py
      - name: Validate Promise deep-dive
        run: python3 scripts/validate-promise.py
      - name: Check Promise semantic examples
        run: node scripts/verify-promise-model.mjs
      - name: Test Promise challenge against native execution order
        run: node --test scripts/verify-promise-quest.mjs
      - name: Verify Promise workbench layout constraints
        run: node scripts/verify-promise-workbench-layout.mjs
      - name: Validate Monorepo course and routes
        run: python3 scripts/validate-monorepo-deep.py
      - name: Validate the three-pillar Monorepo product
        run: python3 scripts/validate-monorepo-product.py
      - name: Test Monorepo graph, affected closure and puzzle gates
        run: node scripts/verify-monorepo-product.mjs
      - name: Test reusable learning challenge engine and registry
        run: node --test scripts/verify-challenge-engine.mjs
      - name: Test learning mastery graph, event log, diagnostics and review scheduling
        run: node --test scripts/verify-learning-progress.mjs
      - name: Test Learning Intelligence V2 migration, review lifecycle and independent verification
        run: node --test scripts/verify-learning-intelligence.mjs
      - name: Verify work-to-knowledge learning integration and checkpoints
        run: node --test scripts/verify-learning-integration.mjs
      - name: Validate React Native third learning domain, prerequisite graph and gap variants
        run: node --test scripts/verify-react-native-domain.mjs
      - name: Test explainable adaptive learning planner and prerequisite scheduling
        run: node --test scripts/verify-learning-planner.mjs
      - name: Parse learning and review browser modules
        run: |
          node --check assets/js/learning-progress.mjs
          node --check assets/js/learning-progress-page.mjs
          node --check assets/js/review-engine.mjs
          node --check assets/js/review-workspace.mjs
          node --check assets/js/learning-activity.mjs
          node --check assets/js/learning-checkpoint-engine.mjs
          node --check assets/js/learning-integration.mjs
          node --check assets/js/learning-planner.mjs
          node --input-type=module --check < assets/js/v2.js
      - name: Validate cloud archive security and sync contracts
        run: node --test scripts/verify-backend-contract.mjs
      - name: Parse backend browser modules
        run: |
          node --check assets/js/backend/config.mjs
          node --check assets/js/backend/auth.mjs
          node --check assets/js/backend/local-event-store.mjs
          node --check assets/js/backend/sync-engine.mjs
          node --check assets/js/backend/account-panel.mjs
          node --check assets/js/backend/callback.mjs
          node --check assets/js/rn-render-pipeline.mjs
          node --check assets/js/rn-architecture-gallery.mjs
          node --check assets/js/rn-architecture-quest.mjs
      - name: Install Playwright browsers for cross-engine review flow
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium webkit
      - name: Browser E2E · Chromium desktop and WebKit mobile viewport
        run: node --test scripts/e2e-learning-intelligence.mjs
      - name: Browser E2E · Work checkpoint and learning telemetry
        run: node --test scripts/e2e-learning-integration.mjs
      - name: Browser E2E · Adaptive daily learning plan
        run: node --test scripts/e2e-learning-planner.mjs
      - name: Browser E2E · React Native domain across all three pillars
        run: node --test scripts/e2e-react-native-domain.mjs
      - name: Parse Monorepo browser modules
        run: |
          node --input-type=module --check < assets/js/monorepo-world.js
          node --input-type=module --check < assets/js/monorepo-exhibition.js
          node --input-type=module --check < assets/js/monorepo-quest.js
          node --check assets/js/monorepo-graph-model.mjs
          node --check assets/js/monorepo-quest-core.mjs
          node --check assets/js/challenge-engine.mjs
          node --check assets/js/learning-progress.mjs
          node --check assets/js/learning-progress-page.mjs
          node --check assets/js/promise-quest.mjs
          node --check assets/js/promise-quest-world.mjs
      - name: Test Monorepo reference graph and affected logic
        run: cd knowledge/monorepo/starter && node --test tests/*.test.mjs
      - name: Verify Monorepo browser lab mechanics offline
        run: node --test scripts/verify-monorepo-labs.mjs
      - name: Rebuild deterministic project ZIP from exact tested sources
        run: python3 scripts/package-fullstack-project.py
      - name: Verify fullstack tutorial and source links
        run: python3 scripts/validate-fullstack.py
      - name: Validate native build reproducibility metadata
        run: |
          cd knowledge/monorepo/fullstack/project
          node tools/verify-lockfile.mjs
          node tools/verify-native-config.mjs
      - name: Unit-test device HTTP telemetry proxy (no emulator needed)
        run: node --test knowledge/monorepo/fullstack/project/tests/device-proxy.test.mjs knowledge/monorepo/fullstack/project/tests/device-faults.test.mjs
      - name: Archive exact fullstack project ZIP
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: knowverse-fullstack-project-${{ github.run_number }}
          path: knowledge/monorepo/fullstack/fullstack-project.zip
          if-no-files-found: error
          retention-days: 7
