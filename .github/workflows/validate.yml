name: Validate KNOWVERSE Content
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check authenticated practice quality Edge Function
        run: deno check supabase/functions/practice-quality-review/index.ts
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build public concept pages and registry-backed catalogues
        run: node scripts/build-public-content.mjs
      - name: Build static site shell, nested navigation and single account control
        run: node scripts/build-site-shell.mjs
      - name: Build deterministic full-text search index from final public pages and Concept registry
        run: python3 scripts/build-search-index.py
      - name: Verify generated search index is reproducible
        run: python3 scripts/build-search-index.py --check
      - name: Build manifest-derived Monorepo workspace graph
        run: python3 scripts/build-monorepo-graph.py
      - name: Verify Monorepo graph is reproducible from package manifests
        run: python3 scripts/build-monorepo-graph.py --check
      - name: Validate V1 content registry and routes
        run: python3 scripts/validate-content.py
      - name: Validate V2 knowledge pages and Mermaid panoramas
        run: python3 scripts/validate-v2.py
      - name: Validate unified navigation, concept graph, canonical routes and static shell coverage
        run: node scripts/validate-site-architecture.mjs
      - name: Verify deterministic static shell generator and mobile navigation fixture
        run: node --test scripts/verify-site-shell.mjs
      - name: Verify registry-driven Concept pages and public coverage portals
        run: node --test scripts/verify-public-content.mjs
      - name: Validate Promise deep-dive
        run: python3 scripts/validate-promise.py
      - name: Check Promise semantic examples
        run: node scripts/verify-promise-model.mjs
      - name: Test Promise challenge against native execution order
        run: node --test scripts/verify-promise-quest.mjs
      - name: Verify Promise workbench layout constraints
        run: node scripts/verify-promise-workbench-layout.mjs
      - name: Validate Monorepo course and routes
        run: python3 scripts/validate-monorepo-deep.py
      - name: Validate the three-pillar Monorepo product
        run: python3 scripts/validate-monorepo-product.py
      - name: Test Monorepo graph, affected closure and puzzle gates
        run: node scripts/verify-monorepo-product.mjs
      - name: Install IndexedDB test dependency after static site scanning
        run: npm install --no-save fake-indexeddb@6.2.7
      - name: Test reusable learning challenge engine and registry
        run: node --test scripts/verify-challenge-engine.mjs
      - name: Test Phase D transactional IndexedDB repository, migration and account isolation
        run: node --test scripts/verify-local-learning-database.mjs scripts/verify-learning-state-storage.mjs
      - name: Test Phase D backend and Supabase security contracts
        run: node --test scripts/verify-backend-contract.mjs
      - name: Replay all Supabase migrations on PostgreSQL 17 (empty and seeded Auth)
        run: bash scripts/verify-supabase-migration-replay.sh
      - name: Verify real sync RPC transactions, RLS isolation, device ownership and CAS rollback on PostgreSQL 17
        run: bash scripts/verify-supabase-sync-isolation.sh
      - name: Test learning mastery graph, event log, diagnostics and review scheduling
        run: node --test scripts/verify-learning-progress.mjs
      - name: Test Learning Intelligence V3 causal graph, review lifecycle and independent verification
        run: node --test scripts/verify-learning-intelligence.mjs
      - name: Verify work-to-knowledge learning integration and checkpoints
        run: node --test scripts/verify-learning-integration.mjs
      - name: Verify contextual, read-only Learning Tutor scene and provider contract
        run: node --test scripts/verify-learning-tutor.mjs
      - name: Verify private learner reflections and optimistic document revisions
        run: node --test scripts/verify-learning-reflections.mjs
      - name: Verify Gap-bound AI practice candidates and non-assessment archive
        run: node --test scripts/verify-learning-practice-candidates.mjs
      - name: Verify Phase M deterministic quality gates, immutable candidate anchors and official Review Engine admission
        run: node --test scripts/verify-learning-practice-quality.mjs
      - name: Verify Phase M append-only audit ordering and unbounded history pagination
        run: node --test scripts/verify-phase-m-audit-order.mjs
      - name: Verify Phase M protected publication and live Pages registration security
        run: node --test scripts/verify-phase-m-publication-security.mjs
      - name: Verify seven-day evidence-based learning reflection
        run: node --test scripts/verify-learning-weekly-review.mjs
      - name: Validate React Native third learning domain, prerequisite graph and gap variants
        run: node --test scripts/verify-react-native-domain.mjs
      - name: Test explainable adaptive learning planner and prerequisite scheduling
        run: node --test scripts/verify-learning-planner.mjs
      - name: Test Phase E learner profile, goals, plan versions, task orchestration and Agent security
        run: node --test scripts/verify-phase-e.mjs
      - name: Test Phase F adaptive review, risk, trends, diagnostics, forecasts, NBA and idempotent task integration
        run: node --test scripts/verify-phase-f.mjs
      - name: Test Phase G evidence quality, strategy calibration, bounded adaptation and audit
        run: node --test scripts/verify-phase-g.mjs
      - name: Parse learning and review browser modules
        run: |
          node --check assets/js/learning-progress.mjs
          node --check assets/js/spaced-repetition-engine.mjs
          node --check assets/js/learning-risk-engine.mjs
          node --check assets/js/next-best-action.mjs
          node --check assets/js/proactive-learning-engine.mjs
          node --check assets/js/learning-strategy-engine.mjs
          node --check assets/js/learning-progress-page.mjs
          node --check assets/js/review-engine.mjs
          node --check assets/js/review-workspace.mjs
          node --check assets/js/learning-activity.mjs
          node --check assets/js/learning-checkpoint-engine.mjs
          node --check assets/js/learning-integration.mjs
          node --check assets/js/learning-tutor.mjs
          node --check assets/js/learning-reflections.mjs
          node --check assets/js/learning-practice-candidates.mjs
          node --check assets/js/learning-practice-quality-review.mjs
          node --check assets/js/learning-practice-quality-validator.mjs
          node --check assets/js/learning-weekly-review.mjs
          node --check assets/js/learning-agent/challenge-task-context.mjs
          node --check assets/js/learning-agent/plan-manager.mjs
          node --check assets/js/learning-agent/task-orchestrator.mjs
          node --check assets/js/learning-agent/workspace.mjs
          node --check assets/js/learning-planner.mjs
          node --check assets/js/learning-progress-page.mjs
          node --check assets/js/proactive-learning-engine.mjs
          node --check assets/js/spaced-repetition-engine.mjs
          node --check assets/js/review-engine.mjs
          node --check assets/js/review-workspace.mjs
          node --check assets/js/promise-quest.mjs
          node --check assets/js/monorepo-quest.js
          node --check assets/js/rn-architecture-quest.mjs
          node --check assets/js/learning-planner.mjs
          node --check assets/js/learning-agent/learner-profile.mjs
          node --check assets/js/learning-agent/goal-manager.mjs
          node --check assets/js/learning-agent/plan-manager.mjs
          node --check assets/js/learning-agent/task-orchestrator.mjs
          node --check assets/js/learning-agent/agent-tools.mjs
          node --check assets/js/learning-agent/agent-provider.mjs
          node --check assets/js/learning-agent/agent-session-store.mjs
          node --check assets/js/learning-agent/local-agent.mjs
          node --check assets/js/learning-agent/workspace.mjs
          node --input-type=module --check < assets/js/v2.js
          node --check assets/js/site-shell.mjs
          node --check assets/js/knowledge-context.mjs
          node --check scripts/e2e-hosted-supabase-sync.mjs
          bash -n scripts/setup-n2-staging-env.sh
          node --check scripts/validate-site-architecture.mjs
          node --check scripts/prepare-approved-practice-publication.mjs
          node --check scripts/record-practice-publication-pr.mjs
          node --check scripts/verify-and-register-published-practice.mjs
          node --check supabase/functions/_shared/practice-audit.mjs
      - name: Parse backend browser modules
        run: |
          node --check assets/js/backend/config.mjs
          node --check assets/js/backend/auth.mjs
          node --check assets/js/learning-event-schema.mjs
          node --check assets/js/backend/local-event-store.mjs
          node --check assets/js/backend/learning-repository.mjs
          node --check assets/js/backend/phase-c-migration.mjs
          node --check assets/js/backend/sync-engine.mjs
          node --check assets/js/backend/local-archive.mjs
          node --check assets/js/backend/archive-bootstrap.mjs
          node --check assets/js/backend/account-panel.mjs
          node --check assets/js/backend/callback.mjs
          node --check assets/js/rn-render-pipeline.mjs
          node --check assets/js/rn-architecture-gallery.mjs
          node --check assets/js/rn-architecture-quest.mjs
      - name: Verify asynchronous browser E2E conditions await database operations
        run: node --test scripts/verify-e2e-async-wait.mjs
      - name: Install Playwright after static validators and browser-module checks
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium webkit
      - name: Browser E2E · Chromium desktop and WebKit mobile viewport
        run: node --test scripts/e2e-learning-intelligence.mjs
      - name: Browser E2E · Global navigation, mobile drawer and no-JavaScript fallback
        run: node --test scripts/e2e-site-navigation.mjs
      - name: Browser E2E · All 44 canonical routes and hash destinations runtime smoke
        run: node --test scripts/e2e-system-route-smoke.mjs
      - name: Browser E2E · Work checkpoint and learning telemetry
        run: node --test scripts/e2e-learning-integration.mjs
      - name: Browser E2E · Context-aware Learning Tutor on course, lab and mobile pages
        run: node --test scripts/e2e-learning-tutor.mjs
      - name: Browser E2E · Socratic tutoring and private learning reflection loop
        run: node --test scripts/e2e-phase-k-learning-loop.mjs
      - name: Browser E2E · Gap-directed AI practice candidates on desktop and mobile
        run: node --test scripts/e2e-phase-l-practice-candidate.mjs
      - name: Browser E2E · Phase M quality review, revision, authorization, idempotent admission and WebKit mobile
        run: node --test scripts/e2e-phase-m-practice-quality.mjs
      - name: Browser E2E · Seven-day learning reflection on desktop and WebKit mobile
        run: node --test scripts/e2e-weekly-learning-review.mjs
      - name: Browser E2E · Promise course reading task lifecycle and non-mastery evidence
        run: node --test scripts/e2e-promise-course-learning.mjs
      - name: Browser E2E · Synthetic H1 Promise learner completes the full evidence-driven pilot
        run: node --test scripts/e2e-phase-h1-pilot.mjs
      - name: Browser E2E · Mac + WebKit iPhone cold restore, offline recovery and CAS conflict resolution
        run: node --test scripts/e2e-cross-device-archive.mjs
      - name: Browser E2E · Adaptive daily learning plan
        run: node --test scripts/e2e-learning-planner.mjs
      - name: Browser E2E · Personal AI Learning Agent, goal lifecycle, offline task restore and WebKit mobile
        run: node --test scripts/e2e-learning-agent.mjs
      - name: Browser E2E · React Native domain across all three pillars
        run: node --test scripts/e2e-react-native-domain.mjs
      - name: Parse Monorepo browser modules
        run: |
          node --input-type=module --check < assets/js/monorepo-world.js
          node --input-type=module --check < assets/js/monorepo-exhibition.js
          node --input-type=module --check < assets/js/monorepo-quest.js
          node --check assets/js/monorepo-graph-model.mjs
          node --check assets/js/monorepo-quest-core.mjs
          node --check assets/js/challenge-engine.mjs
          node --check assets/js/learning-progress.mjs
          node --check assets/js/learning-progress-page.mjs
          node --check assets/js/promise-quest.mjs
          node --check assets/js/promise-quest-world.mjs
      - name: Test Monorepo reference graph and affected logic
        run: cd knowledge/monorepo/starter && node --test tests/*.test.mjs
      - name: Verify Monorepo browser lab mechanics offline
        run: node --test scripts/verify-monorepo-labs.mjs
      - name: Rebuild deterministic project ZIP from exact tested sources
        run: python3 scripts/package-fullstack-project.py
      - name: Verify fullstack tutorial and source links
        run: python3 scripts/validate-fullstack.py
      - name: Validate native build reproducibility metadata
        run: |
          cd knowledge/monorepo/fullstack/project
          node tools/verify-lockfile.mjs
          node tools/verify-native-config.mjs
      - name: Unit-test device HTTP telemetry proxy (no emulator needed)
        run: node --test knowledge/monorepo/fullstack/project/tests/device-proxy.test.mjs knowledge/monorepo/fullstack/project/tests/device-faults.test.mjs
      - name: Archive exact fullstack project ZIP
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: knowverse-fullstack-project-${{ github.run_number }}
          path: knowledge/monorepo/fullstack/fullstack-project.zip
          if-no-files-found: error
          retention-days: 7
