<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 360" role="img" aria-label="跨端端到端测试：模拟点击、代理故障注入、离线回退、恢复和证据"><rect width="1120" height="360" rx="20" fill="#f3f8f7"/><g font-family="Inter,Arial,sans-serif" text-anchor="middle"><g fill="#dcefeb" stroke="#268c83" stroke-width="2"><rect x="30" y="134" width="180" height="82" rx="14"/><rect x="282" y="134" width="180" height="82" rx="14"/><rect x="535" y="30" width="190" height="72" rx="14"/><rect x="535" y="144" width="190" height="72" rx="14"/><rect x="535" y="258" width="190" height="72" rx="14"/><rect x="820" y="116" width="250" height="104" rx="14" fill="#e6f4e8"/></g><g fill="#143c42" font-size="19" font-weight="700"><text x="120" y="168">真实点击</text><text x="120" y="194" font-size="15" font-weight="400">Android / iOS</text><text x="372" y="168">CI 测试代理</text><text x="372" y="194" font-size="15" font-weight="400">仅绑定 loopback</text><text x="630" y="73">正常 JSON</text><text x="630" y="187">HTTP 503</text><text x="630" y="301">非法 JSON</text><text x="945" y="154">离线回退 / 恢复</text><text x="945" y="184" font-size="15" font-weight="400">真实课程与状态断言</text></g><g fill="none" stroke="#367d79" stroke-width="3" stroke-linecap="round"><path d="M210 175H280M462 175H500V66H533M500 175H533M500 175V294H533M725 66H770V140H818M725 180H818M725 294H770V196H818"/><path d="M105 216V265H260"/><path d="M260 265H460" stroke-dasharray="6 6"/></g><text x="560" y="347" fill="#5d777d" font-size="13">每次点击必须对应新的 loading 状态与代理请求事件，不能只匹配上一次错误文案</text></g></svg>