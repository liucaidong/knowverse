<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>02 · 沉浸式知识展厅 · KNOWVERSE</title><style>:root{color-scheme:dark;font-family:Inter,system-ui,sans-serif}*{box-sizing:border-box}body{margin:0;background:#090d18;color:#eef2ff;background-image:radial-gradient(ellipse at 80% 0%,#1f2b51,transparent 40%)}a{color:inherit;text-decoration:none}header{padding:27px max(25px,calc((100vw - 1100px)/2));display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #293149}.logo{font-weight:800;letter-spacing:.13em}.back{font-size:14px;color:#a9b7d7}main{max-width:1100px;margin:auto;padding:76px 24px}small{color:#88e7d5;letter-spacing:.16em}h1{font-size:clamp(40px,7vw,74px);letter-spacing:-.06em;margin:22px 0}p{color:#adb9d3;line-height:1.85}h2{font-size:22px}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:17px;margin-top:55px}.card{border:1px solid #37415e;border-radius:19px;background:#141b2c;padding:28px;min-height:205px;display:flex;flex-direction:column}.card:hover{border-color:#8be3d5}.card strong{font-size:22px}.card span{margin-top:auto;color:#90eddf;padding-top:22px}.pill{font-size:12px;color:#9aa9c8}.panel{border:1px solid #394765;padding:25px;border-radius:18px;background:#10192a;margin-top:30px}button{font:inherit;background:#84ebd8;color:#092528;border:0;padding:12px 18px;border-radius:10px;cursor:pointer;margin:4px}button:disabled{opacity:.35;cursor:not-allowed}pre{white-space:pre-wrap;line-height:1.8;background:#070c14;border-radius:12px;padding:18px;overflow:auto}footer{padding:45px;text-align:center;color:#8495b9}@media(max-width:600px){header{padding:22px}main{padding-top:45px}}</style></head><body><header><a class="logo" href="../">KNOWVERSE / 知域</a><a class="back" href="../">← 返回首页</a></header><main><small>EXPERIENCE / EXPLORE</small><h1>02 · 沉浸式知识展厅</h1><p>感受知识：三维探索、电影级镜头、空间叙事。这里是未来 WebGL 空间知识展览的独立入口。</p><div class="panel"><h2>Promise · 运行宇宙</h2><p>第一件展品：状态与时间。通过视觉化场景观察 Promise 从等待到落定。</p><canvas id="scene" style="width:100%;height:360px;display:block;background:#050b18;border-radius:15px" aria-label="粒子空间预览"></canvas><div><button id="pause">暂停动画</button><button id="change">切换状态</button></div><p id="status">PENDING · 等待状态</p></div><div class="cards"><div class="card"><strong>展览体系</strong><p>时间、状态、依赖、反应：每个概念都可成为独立空间。</p><span>可持续扩展</span></div><div class="card"><strong>演出系统</strong><p>当前为可运行的轻量 Canvas 预览；完整三维展厅将在此入口接入。</p><span>预览版本</span></div></div><script>(()=>{const c=document.getElementById("scene"),ctx=c.getContext("2d");let live=true,mode=0,t=0;const resize=()=>{const r=c.getBoundingClientRect();c.width=Math.max(1,Math.round(r.width*devicePixelRatio));c.height=Math.max(1,Math.round(r.height*devicePixelRatio))};resize();addEventListener("resize",resize);const points=Array.from({length:180},(_,i)=>({a:i*2.39996,r:Math.sqrt(i/180),z:(i*17%101)/101}));function draw(){if(live)t+=.008;ctx.clearRect(0,0,c.width,c.height);const x=c.width/2,y=c.height/2,s=Math.min(c.width,c.height)*.36;points.forEach(p=>{const a=p.a+t*(mode?1.4:.6),r=p.r*s,z=.5+.5*Math.cos(a*1.5+t+p.z*3),px=x+Math.cos(a)*r,py=y+Math.sin(a)*r*.5+Math.sin(a*3+t)*18*devicePixelRatio;ctx.fillStyle=mode?'rgba(122,241,198,'+(.12+.7*z)+')':'rgba(151,163,255,'+(.13+.65*z)+')';ctx.beginPath();ctx.arc(px,py,Math.max(1,1.7*z*devicePixelRatio),0,Math.PI*2);ctx.fill()});requestAnimationFrame(draw)}draw();document.getElementById("pause").onclick=()=>{live=!live;document.getElementById("pause").textContent=live?"暂停动画":"继续动画"};document.getElementById("change").onclick=()=>{mode=1-mode;document.getElementById("status").textContent=mode?"FULFILLED · 已兑现":"PENDING · 等待状态"}})();</script></main><footer>KNOWVERSE — 理解 · 感受 · 运用</footer></body></html>
