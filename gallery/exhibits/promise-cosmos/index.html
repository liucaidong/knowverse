<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Promise 宇宙 · WebGL 3D 展览</title><style>*{box-sizing:border-box}body{margin:0;background:#050712;color:#eef5ff;font:16px system-ui,sans-serif}canvas{position:fixed;inset:0;width:100%;height:100%;display:block}.top{position:fixed;top:22px;left:26px;right:26px;display:flex;align-items:center;justify-content:space-between;gap:16px;pointer-events:none}.top>*{pointer-events:auto}.brand{font-size:13px;font-weight:800;letter-spacing:.15em}.back{color:#a9cfda;text-decoration:none;font-size:14px}.bottom{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);width:min(720px,calc(100% - 30px));background:#091527d9;border:1px solid #3b6573;border-radius:18px;padding:20px 24px;backdrop-filter:blur(15px)}.mini{font-size:11px;letter-spacing:.18em;color:#7cf6d4}h1{font-size:clamp(22px,4vw,36px);margin:7px 0}p{font-size:14px;line-height:1.7;color:#bcc8e0;margin:0 0 15px}.btns{display:flex;flex-wrap:wrap;gap:9px}button{background:#1b3650;color:#dff4fa;border:1px solid #51788a;padding:10px 14px;border-radius:10px;cursor:pointer}button.active{background:#7ef0d8;color:#092328;border-color:#7ef0d8}.hint{font-size:12px;color:#9aacc6;margin-top:10px}#error{position:fixed;top:90px;left:25px;color:#ffc6ac}@media(max-width:600px){.top{left:15px;right:15px}.bottom{bottom:10px;padding:14px}.hint{display:none}}</style></head><body><canvas id="gl" aria-label="实时 WebGL 三维空间渲染"></canvas><div class="top"><span class="brand">KNOWVERSE / SPATIAL EXHIBITION</span><a class="back" href="../../">← 展厅</a></div><div id="error"></div><section class="bottom"><div class="mini" id="chapter">ACT 01 / PENDING</div><h1 id="title">等待中的承诺</h1><p id="desc">每一个 Promise 都从一个尚未定论的状态开始。在这个空间里，核心光体代表 Promise，周围的轨道代表等待中的反应。</p><div class="btns"><button data-act="0" class="active">01 等待</button><button data-act="1">02 兑现</button><button data-act="2">03 反应队列</button><button data-act="3">04 传播</button><button id="motion">暂停镜头</button></div><div class="hint">拖动或触摸画面可以改变镜头角度。WebGL 实时渲染。</div></section><script>
(()=>{'use strict';const canvas=document.getElementById('gl'),err=document.getElementById('error');const gl=canvas.getContext('webgl',{antialias:true,alpha:false})||canvas.getContext('experimental-webgl');if(!gl){err.textContent='设备不支持 WebGL。仍可使用下方章节学习。';return}const vs='attribute vec2 p;void main(){gl_Position=vec4(p,0.,1.);}';const fs='precision highp float;uniform vec2 res;uniform float time;uniform float act;uniform vec2 rot;float sphere(vec3 p,vec3 c,float r){return length(p-c)-r;}float map(vec3 p){float d=sphere(p,vec3(0.,0.,0.),.95);for(int i=0;i<9;i++){float a=float(i)*.6981317+time*.23;vec3 c=vec3(cos(a)*2.3,sin(a*1.6)*.8,sin(a)*2.3);float r=.09+.035*sin(time+float(i));d=min(d,sphere(p,c,r));}if(act>1.5){for(int i=0;i<8;i++){vec3 c=vec3(-2.1+float(i)*.58,-1.4+float(i)*.34,0.);d=min(d,sphere(p,c,.11));}}return d;}vec3 normal(vec3 p){vec2 e=vec2(.002,0.);return normalize(vec3(map(p+e.xyy)-map(p-e.xyy),map(p+e.yxy)-map(p-e.yxy),map(p+e.yyx)-map(p-e.yyx)));}void main(){vec2 uv=(gl_FragCoord.xy-.5*res)/min(res.x,res.y);float a=time*.07+rot.x;vec3 ro=vec3(sin(a)*6.0,1.5+rot.y*2.0,cos(a)*6.0);vec3 f=normalize(-ro);vec3 right=normalize(cross(vec3(0.,1.,0.),f));vec3 up=cross(f,right);vec3 rd=normalize(f*1.6+uv.x*right+uv.y*up);float t=0.;float hit=0.;vec3 p;for(int i=0;i<76;i++){p=ro+rd*t;float d=map(p);if(d<.006){hit=1.;break;}t+=d*.8;if(t>22.)break;}vec3 col=vec3(.015,.025,.065)+.035*(1.-length(uv));float pulse=.5+.5*sin(time*1.4);vec3 hue=mix(vec3(.37,.55,1.),vec3(.26,1.,.72),step(.5,act));if(hit>.5){vec3 n=normal(p);float dif=max(.1,dot(n,normalize(vec3(1.4,2.8,4.))));float fres=pow(1.-max(0.,dot(n,-rd)),2.);col=hue*(.18+dif*.6)+vec3(.7,.95,1.)*fres*.38+vec3(pulse*.08);}float glow=.035/(.05+length(uv));col+=hue*glow*.16;col=pow(col,vec3(.81));gl_FragColor=vec4(col,1.);}';function compile(type,src){const s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw Error(gl.getShaderInfoLog(s));return s}let program;try{program=gl.createProgram();gl.attachShader(program,compile(gl.VERTEX_SHADER,vs));gl.attachShader(program,compile(gl.FRAGMENT_SHADER,fs));gl.linkProgram(program);if(!gl.getProgramParameter(program,gl.LINK_STATUS))throw Error(gl.getProgramInfoLog(program));gl.useProgram(program)}catch(e){err.textContent='WebGL 场景编译失败：'+e.message;return}const buffer=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,buffer);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);const loc=gl.getAttribLocation(program,'p');gl.enableVertexAttribArray(loc);gl.vertexAttribPointer(loc,2,gl.FLOAT,false,0,0);const u=(n)=>gl.getUniformLocation(program,n);const R=u('res'),T=u('time'),A=u('act'),V=u('rot');let act=0,elapsed=0,last=0,playing=true,rotX=0,rotY=0,drag=null;const chapters=[['PENDING','等待中的承诺','每一个 Promise 都从一个尚未定论的状态开始。周围的轨道代表等待中的反应。'],['FULFILLED','承诺兑现','状态从 pending 落定为 fulfilled。状态不可逆；结果可以向依赖它的 Promise 传播。'],['MICROTASKS','反应进入队列','状态变化不意味着回调立即同步运行。Promise reactions 将在微任务检查点执行。'],['PROPAGATION','依赖与传播','链式调用产生新的 Promise。返回值、抛错与 thenable 采用规则决定后继节点的命运。']];function select(n){act=n;document.getElementById('chapter').textContent='ACT 0'+(n+1)+' / '+chapters[n][0];document.getElementById('title').textContent=chapters[n][1];document.getElementById('desc').textContent=chapters[n][2];document.querySelectorAll('[data-act]').forEach(b=>b.classList.toggle('active',Number(b.dataset.act)===n))}document.querySelectorAll('[data-act]').forEach(b=>b.addEventListener('click',()=>select(Number(b.dataset.act))));document.getElementById('motion').onclick=()=>{playing=!playing;document.getElementById('motion').textContent=playing?'暂停镜头':'继续镜头'};canvas.addEventListener('pointerdown',e=>{drag=[e.clientX,e.clientY];canvas.setPointerCapture(e.pointerId)});canvas.addEventListener('pointermove',e=>{if(!drag)return;rotX+=(e.clientX-drag[0])*.006;rotY=Math.max(-.7,Math.min(.7,rotY+(e.clientY-drag[1])*.003));drag=[e.clientX,e.clientY]});canvas.addEventListener('pointerup',()=>drag=null);function draw(now){const dt=Math.min(.05,(now-last)/1000||.016);last=now;if(playing)elapsed+=dt;const w=Math.min(innerWidth*devicePixelRatio,1500),h=Math.min(innerHeight*devicePixelRatio,900);if(canvas.width!==Math.round(w)||canvas.height!==Math.round(h)){canvas.width=w;canvas.height=h;gl.viewport(0,0,w,h)}gl.uniform2f(R,w,h);gl.uniform1f(T,elapsed);gl.uniform1f(A,act);gl.uniform2f(V,rotX,rotY);gl.drawArrays(gl.TRIANGLE_STRIP,0,4);requestAnimationFrame(draw)}requestAnimationFrame(draw)})();
</script><script type="module" src="../../../assets/js/learning-integration.mjs"></script>
